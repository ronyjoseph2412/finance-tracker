name: PR Description Validator

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-pr-description:
    name: Validate PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Set up workspace
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "latest" # Use the latest version of Node.js

      - name: Validate PR Description
        run: |
          # Echo the received PR body
          echo "Fetching the PR description..."

          # Use Node.js to parse the PR description
          node -e "
          const fs = require('fs');
          const path = process.env.GITHUB_EVENT_PATH;
          const data = JSON.parse(fs.readFileSync(path));
          const prDescription = data.pull_request.body;

          console.log('--- PR Description ---');
          console.log(prDescription);

          // Check if a screenshot is included in the PR description (Markdown image)
          const imagePattern = /!\[image\]\(.*\)/;
          const hasImage = imagePattern.test(prDescription);
          console.log('Checking for screenshot...');
          if (hasImage) {
            console.log('✅ Screenshot is attached.');
          } else {
            console.log('❌ Screenshot not found!');
            process.exit(1);
          }

          // Check if the Playwright test case checkbox is ticked
          const checkboxPattern = /- \[x\] Ran all Playwright test cases and they have passed\./;
          const isPlaywrightChecked = checkboxPattern.test(prDescription);
          console.log('Checking for Playwright test case confirmation...');
          if (isPlaywrightChecked) {
            console.log('✅ Playwright test case confirmation is present.');
          } else {
            console.log('❌ Playwright test case confirmation is NOT present!');
            process.exit(1);
          }

          console.log('🎉 PR description is valid!');
          "