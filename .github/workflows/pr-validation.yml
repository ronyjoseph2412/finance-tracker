name: PR Description Validator

on:
  pull_request:
    branches:
      - master
    types: [opened, edited, reopened]

jobs:
  validate-pr-description:
    name: Validate PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Set up workspace
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'latest'  # Use the latest version of Node.js

      - name: Validate PR Description for Screenshot
        run: |
          # Use Node.js to parse the PR description
          PR_DESCRIPTION=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH)); console.log(data.pull_request.body);")

          # Check if a screenshot is included in the PR description
          if [[ "$PR_DESCRIPTION" =~ \!\[.*\]\(.*\) ]]; then
            echo "✅ Screenshot is attached."
          else
            echo "❌ Screenshot not found!"
            exit 1
          fi

          echo "🎉 PR description is valid!"
