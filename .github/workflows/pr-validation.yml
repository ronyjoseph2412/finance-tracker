name: PR Description Validator

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

jobs:
  validate-pr-description:
    name: Validate PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Set up workspace
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "latest" # Use the latest version of Node.js

      - name: Validate PR Description
        run: |
          # Echo the received PR body
          echo "Fetching the PR description..."

          # Use Node.js to parse the PR description
          node -e "
          const fs = require('fs');
          const path = process.env.GITHUB_EVENT_PATH;
          const data = JSON.parse(fs.readFileSync(path));
          const prDescription = data.pull_request.body;
          
          console.log('--- PR Description ---');
          console.log(prDescription);
          
          // Check if a screenshot is included in the PR description (Markdown image)
          const imagePattern = /!\[image\]\(.*\)/;
          const hasImage = imagePattern.test(prDescription);
          console.log('Checking for screenshot...');
          if (hasImage) {
            console.log('✅ Screenshot is attached.');
          } else {
            console.log('❌ Screenshot not found!');
            process.exit(1);
          }

          // Check if the Playwright test case checkbox is ticked
          const checkboxPattern = /- \[x\] Ran all Playwright test cases and they have passed\./;
          const isPlaywrightChecked = checkboxPattern.test(prDescription);
          console.log('Checking for Playwright test case confirmation...');
          if (isPlaywrightChecked) {
            console.log('✅ Playwright test case confirmation is present.');
          } else {
            console.log('❌ Playwright test case confirmation is NOT present!');
            process.exit(1);
          }

          console.log('🎉 PR description is valid!');
          "

      - name: Dry Run - Check PR Body Manually
        run: |
          # Simulating a dry run on the provided PR body for validation
          echo "Running a dry run on the sample PR body..."
          
          PR_BODY="# Pull Request Title\r\n\r\n## Description\r\n\r\n<!-- Please include a summary of the changes and the motivation behind them. -->\r\n\r\n## Related Issue\r\n\r\n<!-- If applicable, reference the issue number that this PR addresses. -->\r\n\r\n## Changes\r\n\r\n<!-- List the main changes made in this PR. -->\r\n\r\n- [ ] Change\r\n\r\n## Checklist\r\n\r\n- [x] Ran all Playwright test cases and they have passed.\r\n\r\n## Screenshots (Testcases)\r\n![image](https://github.com/user-attachments/assets/6bf2247b-e519-4f28-9dfc-fc2c6b788630)\r\n\r\n\r\n## Additional Notes\r\n\r\n"
          
          echo "--- Simulated PR Body ---"
          echo "$PR_BODY"

          # Check for the screenshot in the PR body
          if echo "$PR_BODY" | grep -q '!\[image\](.*)'; then
            echo "✅ Dry Run: Screenshot is attached."
          else
            echo "❌ Dry Run: Screenshot not found!"
            exit 1
          fi

          # Check if the Playwright checkbox is checked in the PR body
          if echo "$PR_BODY" | grep -q '- \[x\] Ran all Playwright test cases and they have passed.'; then
            echo "✅ Dry Run: Playwright test case confirmation is present."
          else
            echo "❌ Dry Run: Playwright test case confirmation is NOT present!"
            exit 1
          fi

          echo "🎉 Dry run completed successfully!"
