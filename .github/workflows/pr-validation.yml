name: PR Description Validator

on:
  pull_request:
    types: [opened, edited, reopened]

jobs:
  validate-pr-description:
    name: Validate PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Set up workspace
        uses: actions/checkout@v2

      - name: Validate PR Description for Screenshot
        run: |
          # Ensure jq is installed
          sudo apt-get install -y jq

          # Fetch PR description using jq
          PR_DESCRIPTION=$(jq -r ".pull_request.body" "$GITHUB_EVENT_PATH")

          # Check if a screenshot is included in the PR description
          if [[ "$PR_DESCRIPTION" == *'![*](*)'* ]]; then
            echo "✅ Screenshot is attached."
          else
            echo "❌ Screenshot not found!"
            exit 1
          fi

          echo "🎉 PR description is valid!"
